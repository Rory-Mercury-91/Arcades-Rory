[package]
name = "yams"
version = "0.1.25"
description = "Feuille de Yams"
authors = ["Rory Mercury 91"]
edition = "2021"

[lib]
name = "yams_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
