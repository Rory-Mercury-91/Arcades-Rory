name: Release

on:
  push:
    tags:
      - "v*"

env:
  NDK_VERSION: "27.2.12479018"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-android:
    name: Android (APK signe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Installer le NDK Android
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            i686-linux-android,
            x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dependances
        run: npm ci

      - name: Initialiser le projet Android Tauri
        run: test -f src-tauri/gen/android/settings.gradle || npm run android:init -- --ci

      - name: Aligner la version sur le tag
        shell: bash
        run: |
          node <<'EOF'
          const fs = require("fs");
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, "");
          const confPath = "src-tauri/tauri.conf.json";
          const conf = JSON.parse(fs.readFileSync(confPath, "utf8"));
          conf.version = version;
          fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + "\n");
          function replaceVersion(path, pattern) {
            const text = fs.readFileSync(path, "utf8");
            if (!pattern.test(text)) throw new Error("Version introuvable dans " + path);
            const next = text.replace(pattern, function (_match, start, end) {
              return start + version + end;
            });
            fs.writeFileSync(path, next);
          }
          replaceVersion("package.json", /("version": ")[^"]+(")/);
          replaceVersion("src-tauri/Cargo.toml", /(^version = ")[^"]+(")/m);
          EOF
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Ecrire la configuration de l'application
        shell: bash
        env:
          YAMS_SUPABASE_URL: ${{ secrets.YAMS_SUPABASE_URL }}
          YAMS_SUPABASE_ANON_KEY: ${{ secrets.YAMS_SUPABASE_ANON_KEY }}
          YAMS_ADMIN_PASSWORD: ${{ secrets.YAMS_ADMIN_PASSWORD }}
        run: |
          if [ -z "$YAMS_SUPABASE_URL" ] || [ -z "$YAMS_SUPABASE_ANON_KEY" ]; then
            echo "::error::YAMS_SUPABASE_URL ou YAMS_SUPABASE_ANON_KEY absent dans les secrets GitHub."
            exit 1
          fi
          node <<'EOF'
          const fs = require("fs");
          const line = (name) => "window." + name + " = " + JSON.stringify(process.env[name] || "") + ";\n";
          fs.writeFileSync("web/yams-config.js",
            line("YAMS_SUPABASE_URL") +
            line("YAMS_SUPABASE_ANON_KEY") +
            line("YAMS_ADMIN_PASSWORD"));
          EOF

      - name: Verifier les secrets Android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 absent - APK release non signe."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_BASE64 present (${#ANDROID_KEYSTORE_BASE64} caracteres)."

      - name: Configurer la signature Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/yams-release.jks"
          {
            echo "password=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "storeFile=${{ github.workspace }}/yams-release.jks"
          } > src-tauri/gen/android/keystore.properties

      - name: Compiler l'APK Android
        run: npm run build:android -- --apk
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      - name: Renommer l'APK
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk/universal/release -name "app-universal-release.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK signe introuvable"
            exit 1
          fi
          cp "$APK" "Yams_${VERSION}_android-universal.apk"
          echo "file=Yams_${VERSION}_android-universal.apk" >> "$GITHUB_OUTPUT"

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Yams ${{ github.ref_name }}
          body: |
            APK universel signe : `${{ steps.apk.outputs.file }}`.

            Sur le telephone, le bandeau de mise a jour ouvre ce telechargement.
          files: ${{ steps.apk.outputs.file }}
          fail_on_unmatched_files: true
